name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR Diff
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} > pr.diff
          LINES=$(wc -l < pr.diff)
          echo "lines=$LINES" >> $GITHUB_OUTPUT
          if [ "$LINES" -gt 5000 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: AI Review
        if: steps.diff.outputs.skip != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # 示例：调用 OpenAI 兼容 API 审查
          DIFF=$(cat pr.diff | head -c 100000)
          
          REVIEW=$(curl -s https://api.openai.com/vhttps://elysiver.h-e.top/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg diff "$DIFF" \
              '{
                model: "deepseek-v4-pro",
                messages: [
                  {
                    role: "system",
                    content: "你是资深代码审查员。重点找：安全漏洞、逻辑错误、性能问题、缺少测试。忽略格式/import顺序。输出 Markdown，按严重程度分类。"
                  },
                  {
                    role: "user",
                    content: ("请审查以下 PR diff：\n\n" + $diff)
                  }
                ]
              }')" | jq -r '.choices[0].message.content')

          # 发布/更新 PR 评论
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "## 🤖 AI Code Review

$REVIEW

---
_由 AI PR Bot 自动生成_"
